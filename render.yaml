services:
  - type: web
    name: leave-management-api
    runtime: dotnet
    rootDir: backend/LeaveManagement.API
    buildCommand: dotnet publish -c Release -o out
    startCommand: dotnet out/LeaveManagement.API.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Set this manually to a SQL Server connection string if deploying the API.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: FRONTEND_URL
        value: https://leave-management-frontend.onrender.com

  - type: web
    name: leave-management-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/leave-management-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
