services:
  - type: web
    name: leave-management-api
    runtime: dotnet
    rootDir: backend/LeaveManagement.API
    buildCommand: dotnet publish -c Release -o out
    startCommand: dotnet out/LeaveManagement.API.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Set to PostgreSQL or SqlServer, matching the connection string you provide below.
      - key: DatabaseProvider
        value: PostgreSQL
      - key: ConnectionStrings__PostgreSQL
        sync: false
      - key: ConnectionStrings__SqlServer
        sync: false
      - key: FRONTEND_URL
        value: https://leave-management-frontend.onrender.com

  - type: web
    name: leave-management-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/leave-management-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
