databases:
  - name: leave-management-db
    databaseName: leave_management_db
    user: leave_management_user

services:
  - type: web
    name: leave-management-api
    runtime: dotnet
    rootDir: backend/LeaveManagement.API
    buildCommand: dotnet publish -c Release -o out
    startCommand: dotnet out/LeaveManagement.API.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: leave-management-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://leave-management-frontend.onrender.com

  - type: web
    name: leave-management-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/leave-management-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
