<div class="card mx-auto" style="max-width: 520px;">
  <div class="card-body p-4 p-lg-5">
    <p class="eyebrow mb-1">Secure access</p>
    <h1 class="page-title mb-2">Sign in</h1>
    <p class="text-muted mb-4">Use a seeded demo account to test Admin, Manager, and Employee access.</p>

    <div *ngIf="error" class="alert app-alert alert-danger" role="alert">{{ error }}</div>

    <form (ngSubmit)="submit()" #loginForm="ngForm" class="row g-3">
      <div class="col-12">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" [(ngModel)]="email" required email autocomplete="username">
      </div>
      <div class="col-12">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" [(ngModel)]="password" required autocomplete="current-password">
      </div>
      <div class="col-12 d-grid">
        <button class="btn btn-primary" [disabled]="loginForm.invalid || loading">{{ loading ? 'Signing in...' : 'Sign in' }}</button>
      </div>
    </form>

    <hr class="my-4">
    <div class="d-grid gap-2">
      <button *ngFor="let user of demoUsers" type="button" class="btn btn-outline-secondary text-start" (click)="useDemo(user)">
        {{ user.role }} — {{ user.email }} / {{ user.password }}
      </button>
    </div>
  </div>
</div>
