<div class="card"><div class="card-body">
  <h3 class="card-title mb-3">Request Leave</h3>
  <div class="alert alert-info" *ngIf="currentUser">Submitting as {{ currentUser.firstName }} {{ currentUser.lastName }} ({{ currentUser.email }}).</div>
  <div *ngIf="message" class="alert alert-success">{{ message }}</div><div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <form (ngSubmit)="submit()" #requestForm="ngForm" class="row g-3">
    <div class="col-md-6"><label class="form-label">Leave Type</label><select class="form-select" name="leaveTypeID" [(ngModel)]="form.leaveTypeID" required><option [ngValue]="0">Select leave type</option><option *ngFor="let t of leaveTypes" [ngValue]="t.leaveTypeID">{{ t.leaveName }}</option></select></div>
    <div class="col-md-6"><label class="form-label">Number of Days</label><input class="form-control" [value]="numberOfDays" disabled></div>
    <div class="col-md-6"><label class="form-label">From Date</label><input class="form-control" type="date" name="fromDate" [min]="today" [(ngModel)]="form.fromDate" (change)="calculateDays()" required></div>
    <div class="col-md-6"><label class="form-label">To Date</label><input class="form-control" type="date" name="toDate" [min]="form.fromDate || today" [(ngModel)]="form.toDate" (change)="calculateDays()" required></div>
    <div class="col-12"><label class="form-label">Reason</label><textarea class="form-control" name="reason" [(ngModel)]="form.reason" maxlength="500" required></textarea></div>
    <div class="col-12"><button class="btn btn-primary" [disabled]="requestForm.invalid || form.leaveTypeID === 0 || loading">{{ loading ? 'Submitting...' : 'Submit Request' }}</button></div>
  </form>
</div></div>
