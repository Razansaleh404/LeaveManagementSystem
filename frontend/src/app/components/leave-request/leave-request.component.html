<section class="page-header mb-4">
  <div>
    <p class="eyebrow mb-1">Employee Self Service</p>
    <h1 class="page-title mb-1">Request leave</h1>
    <p class="page-subtitle mb-0">Submit a leave request from your signed-in employee profile.</p>
  </div>
</section>

<div class="card app-card mx-auto" style="max-width: 860px;"><div class="card-body p-4">
  <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-4">
    <div>
      <h2 class="section-title mb-1">Create Leave Request</h2>
      <p class="text-muted mb-0 small">Managers will review pending requests after submission.</p>
    </div>
    <div class="employee-request-chip" *ngIf="employee">
      <span class="text-muted small d-block">Requesting as</span>
      <strong>{{ employee.firstName }} {{ employee.lastName }}</strong>
      <span class="d-block small">{{ employee.department }}</span>
    </div>
  </div>

  <div *ngIf="message" class="alert app-alert alert-success">{{ message }}</div><div *ngIf="error" class="alert app-alert alert-danger">{{ error }}</div>
  <form (ngSubmit)="submit()" #requestForm="ngForm" class="row g-3">
    <div class="col-md-6"><label class="form-label">Employee</label><input class="form-control" [value]="employee ? employee.firstName + ' ' + employee.lastName : 'No employee selected'" disabled></div>
    <div class="col-md-6"><label class="form-label">Leave Type</label><select class="form-select" name="leaveTypeID" [(ngModel)]="form.leaveTypeID" required><option [ngValue]="0">Select leave type</option><option *ngFor="let t of leaveTypes" [ngValue]="t.leaveTypeID">{{ t.leaveName }}</option></select></div>
    <div class="col-md-4"><label class="form-label">From Date</label><input class="form-control" type="date" name="fromDate" [min]="today" [(ngModel)]="form.fromDate" (change)="calculateDays()" required></div>
    <div class="col-md-4"><label class="form-label">To Date</label><input class="form-control" type="date" name="toDate" [min]="form.fromDate || today" [(ngModel)]="form.toDate" (change)="calculateDays()" required></div>
    <div class="col-md-4"><label class="form-label">Number of Days</label><input class="form-control" [value]="numberOfDays" disabled></div>
    <div class="col-12"><label class="form-label">Reason</label><textarea class="form-control" name="reason" [(ngModel)]="form.reason" maxlength="500" required></textarea></div>
    <div class="col-12"><button class="btn btn-primary" [disabled]="requestForm.invalid || form.leaveTypeID === 0 || loading">{{ loading ? 'Submitting...' : 'Submit Request' }}</button></div>
  </form>
</div></div>
