<div class="card page-card mx-auto" style="max-width: 860px;">
  <div class="card-body">
    <h1 class="h4 mb-3">New Leave Request</h1>
    <div *ngIf="message" class="alert alert-success">{{ message }}</div>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <form #requestForm="ngForm" (ngSubmit)="submit(requestForm)" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Employee</label>
          <select class="form-select" name="employeeID" [(ngModel)]="model.employeeID" required>
            <option [ngValue]="0">Select employee</option>
            <option *ngFor="let employee of employees" [ngValue]="employee.employeeID">{{ employee.employeeCode }} - {{ employee.fullName }}</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Leave Type</label>
          <select class="form-select" name="leaveTypeID" [(ngModel)]="model.leaveTypeID" required>
            <option [ngValue]="0">Select leave type</option>
            <option *ngFor="let type of leaveTypes" [ngValue]="type.leaveTypeID">{{ type.leaveName }}</option>
          </select>
        </div>
        <div class="col-md-4"><label class="form-label">From Date</label><input class="form-control" type="date" name="fromDate" [(ngModel)]="model.fromDate" [min]="today" required></div>
        <div class="col-md-4"><label class="form-label">To Date</label><input class="form-control" type="date" name="toDate" [(ngModel)]="model.toDate" [min]="model.fromDate || today" required></div>
        <div class="col-md-4"><label class="form-label">Number of Days</label><input class="form-control" [value]="numberOfDays" readonly></div>
        <div class="col-12"><label class="form-label">Reason</label><textarea class="form-control" rows="4" name="reason" [(ngModel)]="model.reason" required maxlength="500"></textarea></div>
      </div>
      <button class="btn btn-primary mt-4" type="submit">Submit Request</button>
    </form>
  </div>
</div>
