<div class="card"><div class="card-body">
  <h3 class="card-title mb-3">Manager Pending Requests</h3>
  <div *ngIf="message" class="alert alert-success">{{ message }}</div><div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div *ngIf="loading" class="text-center py-4">Loading pending requests...</div>
  <div class="row g-3" *ngIf="!loading">
    <div class="col-12" *ngFor="let r of requests"><div class="border rounded p-3 bg-white">
      <div class="d-flex flex-column flex-md-row justify-content-between gap-2"><div><h5 class="mb-1">{{ r.employee?.firstName }} {{ r.employee?.lastName }}</h5><div class="text-muted">{{ r.leaveType?.leaveName }} · {{ r.fromDate }} to {{ r.toDate }} · {{ r.numberOfDays }} day(s)</div></div><span class="badge bg-warning text-dark align-self-start">{{ r.status }}</span></div>
      <p class="mt-3 mb-2"><strong>Reason:</strong> {{ r.reason }}</p>
      <label class="form-label">Manager Comments</label><textarea class="form-control mb-3" [(ngModel)]="comments[r.requestID]" maxlength="500" placeholder="Add optional comments"></textarea>
      <button class="btn btn-success me-2" (click)="approve(r)">Approve</button><button class="btn btn-danger" (click)="reject(r)">Reject</button>
    </div></div>
    <div *ngIf="requests.length === 0" class="col-12"><div class="alert alert-info">No pending requests.</div></div>
  </div>
</div></div>
